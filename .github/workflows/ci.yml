name: CI

# Every push, on any branch. Pull requests are deliberately not a trigger:
# the branches here are all our own, so a PR would run the same commit twice.
# Tags are excluded because an unfiltered `push` includes them, and a release
# tag would run all three jobs a second time on a commit that already passed
# them on its way into main — while release.yml is building the same commit.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# A second push supersedes the first. Without this the older run keeps burning
# minutes on a commit nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    # The default is six hours, which is how long a hung job sits there holding
    # the branch's concurrency slot before anyone finds out.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than tracking stable. This toolchain is particular —
      # permission_handler is held below 14 and compileSdk is 37 — so an SDK
      # that moves on its own would turn an unrelated morning into a bisect.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # No gen-l10n step: the generated localisations are committed, and
      # `pub get` regenerates them anyway.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The builds run alongside the checks rather than after them: a failing
  # analyze is usually a lint, which says nothing about whether the thing
  # compiles, and waiting three minutes to find out costs more than it saves.
  android:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned to what the app compiles against (build.gradle.kts asks for
      # source and target 17). The runner image ships more than one JDK and
      # picks its own default, which is exactly the kind of thing that moves.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # android/key.properties is not in the repository, so this signs with the
      # debug key. That is fine: what is being checked here is the shrinker, not
      # the signature, and nothing built by this job is ever installed. The
      # signature is tool/release.sh's job, where the real key lives.
      - run: flutter build apk --release

      # The reason this job exists. The release build shrinks resources and the
      # shrinker cannot see a drawable that only Dart names as a string; when it
      # deletes one, audio_service throws out of every setPlaybackState and the
      # notification and the car's media session die. No emulator shows it,
      # because only release builds shrink.
      - run: tool/check_drawables.sh build/app/outputs/flutter-apk/app-release.apk

  # Neither of these can play anything yet — just_audio and audio_service have
  # no Windows or Linux implementation — but the app compiles for both, and the
  # music-folder picker is written for them. Building here is what keeps that
  # code honest from a machine that is neither.
  linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # What `flutter build linux` links against. libsecret is
      # flutter_secure_storage's, and lld is looked for by name inside the LLVM
      # directory, which the clang package alone does not fill in.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev \
            libsecret-1-dev lld llvm

      - run: flutter pub get
      - run: flutter build linux --release

  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

  macos:
    name: Build macOS release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed ad-hoc — the Xcode project asks for identity "-", so this needs
      # no certificate and produces nothing distributable. It is here because
      # macOS is the platform nobody runs by hand: the entitlements, the pods
      # and the icon catalogue all break silently until something builds them.
      - run: flutter build macos --release
